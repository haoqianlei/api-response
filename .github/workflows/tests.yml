name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '^10.0', testbench: '^8.0', php: '8.1' }
          - { laravel: '^11.0', testbench: '^9.0', php: '8.2' }
          - { laravel: '^12.0', testbench: '^10.0', php: '8.2' }
          - { laravel: '^13.2', testbench: '^11.0', php: '8.3' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl
          coverage: none
          tools: composer:v2
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
      # Test historical framework versions even when their dependencies have advisories.
      # This setting is confined to the CI checkout, not shipped in composer.json.
      - run: composer config audit.block-insecure false
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
